<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수행평가 알림장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Classic Serif Fonts: Gowun Batang & Noto Serif KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Gowun Batang', 'Noto Serif KR', serif;
            background: linear-gradient(180deg, #f8f4ee 0%, #f3ece2 100%); /* 마음이 편안해지는 따뜻하고 은은한 샌드 베이지 */
            background-attachment: fixed;
            color: #38322c;
            min-height: 100vh;
        }

        /* 클래식 서체 강조용 스타일 클래스 */
        .font-classic {
            font-family: 'Gowun Batang', serif;
        }

        /* 눈과 마음이 편안한 아늑한 포스트잇 카드 스타일 */
        .card-postit {
            background: #fffdf7; /* 부드럽고 아늑한 버터 크림 톤 */
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(70, 60, 50, 0.04);
            border: 1px solid rgba(220, 208, 192, 0.6);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
        }

        .card-postit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(70, 60, 50, 0.08);
        }

        .card-completed {
            opacity: 0.65;
            background: #f2ece4;
            border-color: rgba(200, 188, 172, 0.5);
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(180, 168, 150, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="pb-24">

    <!-- 상단 헤더 -->
    <header class="w-full py-6 px-6 mb-6 border-b border-stone-300/30 bg-white/40 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
            <div>
                <div class="flex items-center gap-2 mb-0.5">
                    <span class="text-xs tracking-widest text-amber-900/60 font-semibold uppercase">Calm & Focus</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-stone-800 tracking-tight font-classic">수행평가 알림장</h1>
                <p class="text-stone-500 text-xs mt-1 font-normal">여유로운 마음으로 오늘의 수행평가를 챙겨보세요.</p>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="exportTasks()" title="데이터 내보내기" class="bg-stone-200/60 hover:bg-stone-200 text-stone-700 text-xs font-medium px-3 py-2.5 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">내보내기</span>
                </button>
                <button onclick="document.getElementById('importFile').click()" title="데이터 불러오기" class="bg-stone-200/60 hover:bg-stone-200 text-stone-700 text-xs font-medium px-3 py-2.5 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">불러오기</span>
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importTasks(event)">

                <button id="openAddModalBtn" onclick="openTaskModal()" class="bg-stone-800 hover:bg-stone-900 text-amber-50 text-xs sm:text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>수행평가 추가</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-5xl mx-auto px-6">
        <!-- 달성률/진척도 프로그레스 바 -->
        <div class="mb-6 bg-white/60 border border-stone-200/80 rounded-2xl p-4 backdrop-blur-xs">
            <div class="flex justify-between items-center mb-2 text-xs font-medium text-stone-700">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line text-stone-500"></i>
                    달성률
                </span>
                <span id="progressPercent" class="font-bold text-stone-800">0% (0 / 0 완료)</span>
            </div>
            <div class="w-full bg-stone-200/70 h-2.5 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-amber-700/80 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <!-- 필터 및 검색 영역 -->
        <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3 text-sm flex-wrap">
                <span class="text-stone-600 font-medium">전체 <strong id="totalCount" class="text-stone-800 font-bold">0</strong></span>
                <span class="text-stone-300">|</span>
                <span class="text-amber-800 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-500 inline-block animate-ping"></span>
                    오늘 마감 <strong id="d0Count" class="font-bold">0</strong>
                </span>
                <span class="text-stone-300">|</span>
                <span class="text-rose-700/80 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-rose-400 inline-block"></span>
                    내일 마감 <strong id="d1Count" class="font-bold">0</strong>
                </span>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <!-- 과목/메모 검색창 -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-stone-400"></i>
                    <input type="text" id="searchInput" oninput="renderTasks()" placeholder="검색어 입력..." 
                           class="w-36 sm:w-44 pl-8 pr-3 py-1.5 text-xs bg-white/70 border border-stone-300/40 rounded-xl focus:outline-none focus:ring-1 focus:ring-stone-400 text-stone-800">
                </div>

                <!-- 정렬 기준 선택 -->
                <select id="sortSelect" onchange="renderTasks()" class="px-2.5 py-1.5 text-xs bg-white/70 border border-stone-300/40 rounded-xl text-stone-700 focus:outline-none focus:ring-1 focus:ring-stone-400">
                    <option value="dday">마감순 (D-Day)</option>
                    <option value="subject">과목명순</option>
                    <option value="latest">최신 등록순</option>
                </select>

                <!-- 탭 필터 -->
                <div class="flex bg-stone-200/50 p-1 rounded-xl text-xs font-medium text-stone-600 border border-stone-300/30">
                    <button onclick="filterTasks('all')" id="btn-all" class="filter-btn px-3 py-1 rounded-lg bg-white/90 text-stone-800 font-semibold shadow-xs transition">전체</button>
                    <button onclick="filterTasks('upcoming')" id="btn-upcoming" class="filter-btn px-3 py-1 rounded-lg hover:text-stone-900 transition">진행중</button>
                    <button onclick="filterTasks('d1')" id="btn-d1" class="filter-btn px-3 py-1 rounded-lg hover:text-stone-900 transition">마감임박</button>
                    <button onclick="filterTasks('done')" id="btn-done" class="filter-btn px-3 py-1 rounded-lg hover:text-stone-900 transition">완료됨</button>
                </div>
            </div>
        </div>

        <!-- 카드 그리드 영역 -->
        <div id="postitGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- 자바스크립트로 카드 렌더링 -->
        </div>

        <!-- 데이터가 없을 때 표시할 미니멀 Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-12 h-12 rounded-full bg-stone-200/50 flex items-center justify-center text-stone-400 mb-3">
                <i class="fa-regular fa-lightbulb text-lg"></i>
            </div>
            <p class="text-stone-600 text-sm font-medium">표시할 수행평가가 없습니다.</p>
            <p class="text-stone-400 text-xs mt-1">새로운 수행평가를 등록하거나 필터를 확인해보세요.</p>
        </div>
    </main>

    <!-- 모바일 Floating Action Button -->
    <button onclick="openTaskModal()" class="sm:hidden fixed bottom-6 right-6 w-13 h-13 rounded-full bg-stone-800 text-amber-50 shadow-xl flex items-center justify-center text-lg z-20 hover:bg-stone-900 active:scale-95 transition">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- D-1/D-0 긴급 알림 팝업 모달 -->
    <div id="d1PopupModal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/30 backdrop-blur-xs hidden p-4">
        <div class="bg-[#fffdf9] rounded-2xl max-w-sm w-full p-6 shadow-2xl relative border border-stone-200/60">
            <div class="flex items-center gap-2 mb-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
                <span class="text-xs font-semibold text-rose-700 tracking-wide">마감 임박 알림</span>
            </div>
            <h2 class="text-lg font-bold text-stone-800 mb-1 font-classic">곧 제출할 수행평가가 있어요</h2>
            <p class="text-xs text-stone-500 mb-4">잊지 말고 제출 및 준비를 확인하세요.</p>
            
            <!-- D-1/D-0 목록 -->
            <div id="d1ListContainer" class="space-y-2.5 max-h-56 overflow-y-auto mb-5">
                <!-- JS로 항목 삽입 -->
            </div>

            <button onclick="closeD1Popup()" class="w-full py-2.5 bg-stone-800 hover:bg-stone-900 text-amber-50 font-medium text-xs rounded-xl transition shadow-xs">
                확인했습니다
            </button>
        </div>
    </div>

    <!-- 수행평가 추가/수정 모달 -->
    <div id="taskModal" class="fixed inset-0 z-40 flex items-center justify-center bg-stone-900/30 backdrop-blur-xs hidden p-4">
        <div class="bg-[#fffdf9] rounded-2xl max-w-md w-full p-6 shadow-2xl relative border border-stone-200/60">
            <div class="flex justify-between items-center mb-5">
                <h3 id="modalTitle" class="text-base font-bold text-stone-800 font-classic">새 수행평가 등록</h3>
                <button onclick="closeTaskModal()" class="text-stone-400 hover:text-stone-600 text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="taskId">
                
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">과목명 <span class="text-rose-400">*</span></label>
                    <input type="text" id="subjectInput" required placeholder="예: 국어, 영어, 수학" 
                           class="w-full px-3 py-2.5 bg-stone-100/60 border border-stone-200/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 text-xs text-stone-800">
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">제출 / 평가 일자 <span class="text-rose-400">*</span></label>
                    <input type="date" id="dueDateInput" required 
                           class="w-full px-3 py-2.5 bg-stone-100/60 border border-stone-200/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 text-xs text-stone-800">
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">선생님 안내문 링크 (선택)</label>
                    <input type="url" id="linkInput" placeholder="https://..." 
                           class="w-full px-3 py-2.5 bg-stone-100/60 border border-stone-200/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 text-xs text-stone-800">
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1.5">메모 / 준비사항 (선택)</label>
                    <textarea id="memoInput" rows="3" placeholder="준비물, 발표 분량 등 메모 입력" 
                              class="w-full px-3 py-2.5 bg-stone-100/60 border border-stone-200/80 rounded-xl focus:outline-none focus:ring-2 focus:ring-stone-400 text-xs resize-none text-stone-800"></textarea>
                </div>

                <div class="pt-3 flex gap-2 justify-end">
                    <button type="button" onclick="closeTaskModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl font-medium text-xs transition">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 bg-stone-800 hover:bg-stone-900 text-white font-medium rounded-xl shadow-xs text-xs transition">
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DEFAULT_TASKS = [
            {
                id: 'sample-0',
                subject: '수학',
                dueDate: getRelativeDateStr(0), // 오늘 마감
                link: '',
                memo: '단원평가 문제풀이 오답노트 작성 및 제출',
                completed: false,
                createdAt: Date.now() - 300000
            },
            {
                id: 'sample-1',
                subject: '국어',
                dueDate: getRelativeDateStr(1), // 내일 마감
                link: 'https://docs.google.com/document/d/example1',
                memo: '현대시 분석 독후감 작성 후 A4 프린트 제출하기',
                completed: false,
                createdAt: Date.now() - 200000
            },
            {
                id: 'sample-2',
                subject: '영어',
                dueDate: getRelativeDateStr(3),
                link: 'https://classroom.google.com/',
                memo: '자유 주제 3분 팝송 스피치 발표 PPT 준비',
                completed: false,
                createdAt: Date.now() - 100000
            }
        ];

        let tasks = [];
        let currentFilter = 'all';

        function getRelativeDateStr(daysToAdd) {
            const date = new Date();
            date.setDate(date.getDate() + daysToAdd);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 효과음 생성 (웹 오디오 API 이용 - 부드럽고 차분한 차임 sound)
        function playChime(freq = 523.25, duration = 0.15) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // AudioContext 무시 (사용자 상호작용 브라우저 차단 시)
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            renderTasks();
            checkAndShowD1Popup();
        });

        function loadTasks() {
            const stored = localStorage.getItem('school_tasks');
            if (stored) {
                try {
                    tasks = JSON.parse(stored);
                } catch (e) {
                    tasks = DEFAULT_TASKS;
                }
            } else {
                tasks = DEFAULT_TASKS;
                saveTasks();
            }
        }

        function saveTasks() {
            localStorage.setItem('school_tasks', JSON.stringify(tasks));
        }

        function calculateDDay(dueDateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const target = new Date(dueDateStr);
            target.setHours(0, 0, 0, 0);

            const diffTime = target.getTime() - today.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        function toggleTaskCompletion(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
                if (task.completed) {
                    playChime(659.25, 0.2); // E5 차임 음
                }
            }
        }

        function renderTasks() {
            const grid = document.getElementById('postitGrid');
            const emptyState = document.getElementById('emptyState');
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;
            grid.innerHTML = '';

            let filtered = tasks.filter(t => {
                const dday = calculateDDay(t.dueDate);
                const matchesSearch = t.subject.toLowerCase().includes(searchKeyword) || (t.memo && t.memo.toLowerCase().includes(searchKeyword));
                if (!matchesSearch) return false;

                if (currentFilter === 'upcoming') return !t.completed && dday >= 0;
                if (currentFilter === 'd1') return !t.completed && (dday === 0 || dday === 1);
                if (currentFilter === 'done') return t.completed;
                return true;
            });

            // 정렬 처리
            filtered.sort((a, b) => {
                if (a.completed !== b.completed) return a.completed ? 1 : -1;

                if (sortMode === 'subject') {
                    return a.subject.localeCompare(b.subject, 'ko');
                } else if (sortMode === 'latest') {
                    return (b.createdAt || 0) - (a.createdAt || 0);
                } else { // 'dday'
                    return new Date(a.dueDate) - new Date(b.dueDate);
                }
            });

            // 상단 카운트 및 진척도 업데이터
            const completedCount = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            document.getElementById('totalCount').innerText = total;

            const d0Count = tasks.filter(t => !t.completed && calculateDDay(t.dueDate) === 0).length;
            const d1Count = tasks.filter(t => !t.completed && calculateDDay(t.dueDate) === 1).length;
            document.getElementById('d0Count').innerText = d0Count;
            document.getElementById('d1Count').innerText = d1Count;

            const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
            document.getElementById('progressPercent').innerText = `${percent}% (${completedCount} / ${total} 완료)`;
            document.getElementById('progressBar').style.width = `${percent}%`;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            filtered.forEach((task) => {
                const dday = calculateDDay(task.dueDate);

                let ddayBadgeHtml = '';
                if (task.completed) {
                    ddayBadgeHtml = `<span class="bg-stone-300 text-stone-600 font-medium px-2.5 py-0.5 rounded-full text-xs">완료됨</span>`;
                } else if (dday === 0) {
                    ddayBadgeHtml = `<span class="bg-amber-600 text-white font-bold px-2.5 py-0.5 rounded-full text-xs animate-bounce">D-Day 오늘!</span>`;
                } else if (dday === 1) {
                    ddayBadgeHtml = `<span class="bg-rose-400 text-white font-bold px-2.5 py-0.5 rounded-full text-xs">D-1 내일</span>`;
                } else if (dday < 0) {
                    ddayBadgeHtml = `<span class="bg-stone-200 text-stone-500 font-medium px-2.5 py-0.5 rounded-full text-xs">기한 만료</span>`;
                } else {
                    ddayBadgeHtml = `<span class="bg-amber-100 text-amber-900 border border-amber-200 font-bold px-2.5 py-0.5 rounded-full text-xs">D-${dday}</span>`;
                }

                const card = document.createElement('div');
                card.className = `card-postit p-5 flex flex-col justify-between relative ${task.completed ? 'card-completed' : ''}`;

                card.innerHTML = `
                    <div>
                        <!-- 카드 상단: 체크박스 + 과목명 + D-Day -->
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <div class="flex items-center gap-2.5">
                                <button onclick="toggleTaskCompletion('${task.id}')" title="${task.completed ? '미완료로 표시' : '완료로 표시'}"
                                        class="w-5 h-5 rounded-md border transition flex items-center justify-center ${task.completed ? 'bg-amber-800 border-amber-800 text-white' : 'border-stone-400 hover:border-stone-600 bg-white'}">
                                    ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                </button>
                                <h3 class="text-lg font-bold text-stone-800 font-classic ${task.completed ? 'line-through text-stone-500' : ''}">
                                    ${escapeHtml(task.subject)}
                                </h3>
                            </div>
                            ${ddayBadgeHtml}
                        </div>

                        <!-- 마감 날짜 -->
                        <p class="text-xs text-stone-400 mb-3 flex items-center gap-1 font-sans">
                            <i class="fa-regular fa-calendar-check"></i>
                            ${task.dueDate} 까지
                        </p>

                        <!-- 메모 -->
                        ${task.memo ? `
                            <p class="text-xs text-stone-600 leading-relaxed mb-4 whitespace-pre-line bg-amber-50/50 p-3 rounded-xl border border-amber-100/50 ${task.completed ? 'line-through opacity-70' : ''}">
                                ${escapeHtml(task.memo)}
                            </p>
                        ` : ''}
                    </div>

                    <!-- 하단 버튼 영역 -->
                    <div class="pt-3 border-t border-stone-200/50 flex items-center justify-between text-xs text-stone-500">
                        <div>
                            ${task.link ? `
                                <a href="${escapeHtml(task.link)}" target="_blank" rel="noopener noreferrer" 
                                   class="text-amber-800 hover:underline font-medium inline-flex items-center gap-1">
                                    <i class="fa-solid fa-link text-2xs"></i> 안내문
                                </a>
                            ` : '<span class="text-stone-300">링크 없음</span>'}
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="openTaskModal('${task.id}')" class="hover:text-stone-800 transition" title="수정">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteTask('${task.id}')" class="hover:text-rose-600 transition" title="삭제">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterTasks(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-white/90', 'text-stone-800', 'font-semibold', 'shadow-xs');
                btn.classList.add('hover:text-stone-900');
            });

            const activeBtn = document.getElementById(`btn-${filterType}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white/90', 'text-stone-800', 'font-semibold', 'shadow-xs');
                activeBtn.classList.remove('hover:text-stone-900');
            }

            renderTasks();
        }

        function checkAndShowD1Popup() {
            const urgentTasks = tasks.filter(t => !t.completed && (calculateDDay(t.dueDate) === 0 || calculateDDay(t.dueDate) === 1));

            if (urgentTasks.length > 0) {
                const container = document.getElementById('d1ListContainer');
                container.innerHTML = '';

                urgentTasks.forEach(task => {
                    const dday = calculateDDay(task.dueDate);
                    const label = dday === 0 ? '오늘 마감' : '내일 마감';
                    const labelBg = dday === 0 ? 'bg-amber-600' : 'bg-rose-400';

                    const item = document.createElement('div');
                    item.className = 'p-3 bg-stone-100/70 rounded-xl border border-stone-200/50 flex flex-col gap-1 text-xs';
                    item.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-stone-800 font-classic text-sm">${escapeHtml(task.subject)}</span>
                            <span class="${labelBg} text-white text-2xs px-2 py-0.5 rounded-full font-bold">${label}</span>
                        </div>
                        ${task.memo ? `<p class="text-stone-600 text-xs">${escapeHtml(task.memo)}</p>` : ''}
                        ${task.link ? `
                            <a href="${escapeHtml(task.link)}" target="_blank" class="text-amber-800 font-medium hover:underline mt-1 inline-flex items-center gap-1">
                                <i class="fa-solid fa-arrow-up-right-from-square text-2xs"></i> 선생님 안내문 보기
                            </a>
                        ` : ''}
                    `;
                    container.appendChild(item);
                });

                document.getElementById('d1PopupModal').classList.remove('hidden');
            }
        }

        function closeD1Popup() {
            document.getElementById('d1PopupModal').classList.add('hidden');
        }

        function openTaskModal(taskId = null) {
            const modal = document.getElementById('taskModal');
            const form = document.getElementById('taskForm');
            const modalTitle = document.getElementById('modalTitle');

            form.reset();
            document.getElementById('taskId').value = '';

            if (taskId) {
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    modalTitle.innerText = '수행평가 수정';
                    document.getElementById('taskId').value = task.id;
                    document.getElementById('subjectInput').value = task.subject;
                    document.getElementById('dueDateInput').value = task.dueDate;
                    document.getElementById('linkInput').value = task.link || '';
                    document.getElementById('memoInput').value = task.memo || '';
                }
            } else {
                modalTitle.innerText = '새 수행평가 등록';
                document.getElementById('dueDateInput').value = getRelativeDateStr(1);
            }

            modal.classList.remove('hidden');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const id = document.getElementById('taskId').value;
            const subject = document.getElementById('subjectInput').value.trim();
            const dueDate = document.getElementById('dueDateInput').value;
            const link = document.getElementById('linkInput').value.trim();
            const memo = document.getElementById('memoInput').value.trim();

            if (!subject || !dueDate) return;

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.subject = subject;
                    task.dueDate = dueDate;
                    task.link = link;
                    task.memo = memo;
                }
            } else {
                const newTask = {
                    id: 'task-' + Date.now(),
                    subject,
                    dueDate,
                    link,
                    memo,
                    completed: false,
                    createdAt: Date.now()
                };
                tasks.push(newTask);
                playChime(523.25, 0.15);
            }

            saveTasks();
            renderTasks();
            closeTaskModal();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function exportTasks() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tasks, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `수행평가일정_${getRelativeDateStr(0)}.json`);
            dlAnchorElem.click();
        }

        function importTasks(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        tasks = imported;
                        saveTasks();
                        renderTasks();
                    }
                } catch (err) {
                    // 오류 핸들링
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
